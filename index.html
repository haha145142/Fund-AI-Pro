<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fund AI Pro Ultimate</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
background:#050505;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
color:white;
padding:18px;
}
.header{
display:flex;
justify-content:space-between;
align-items:center;
margin:10px 0 20px;
}
.logo{
font-size:28px;
font-weight:800;
}
.time{
color:#8e8e93;
font-size:13px;
}
.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(30px);
-webkit-backdrop-filter:blur(30px);
border-radius:24px;
padding:18px;
margin-bottom:16px;
border:1px solid rgba(255,255,255,.06);
}
.score{
font-size:42px;
font-weight:900;
margin-top:8px;
}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:14px;
}
.small{
padding:14px;
border-radius:18px;
background:rgba(255,255,255,.05);
}
.badge{
display:inline-block;
padding:4px 10px;
border-radius:999px;
background:#4da3ff;
font-size:12px;
margin-top:8px;
}
.bottom{
position:fixed;
left:0;
right:0;
bottom:0;
padding:14px;
background:rgba(10,10,10,.9);
backdrop-filter:blur(25px);
display:flex;
justify-content:space-around;
border-top:1px solid rgba(255,255,255,.08);
}
.tab{
text-align:center;
color:#8e8e93;
font-size:12px;
}
.tab.active{
color:white;
}
</style>
</head>

<body>

<div class="header">
<div class="logo">Fund AI</div>
<div class="time" id="time"></div>
</div>
<!-- 搜索栏 -->
<div class="card" style="padding:14px;margin-top:10px;">
  <div style="display:flex;align-items:center;gap:10px;">
    <span style="font-size:20px;">🔍</span>
    <input id="searchInput"
      placeholder="搜索基金名称或代码（如：广发半导体 014861）"
      style="flex:1;background:transparent;border:none;color:white;font-size:16px;outline:none;">
  </div>
</div>

<!-- 持仓模块 -->
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <div>
      <div style="font-size:22px;font-weight:800;">基金持仓</div>
      <div style="font-size:13px;color:#888;margin-top:4px;">官方净值 · AI分析</div>
    </div>
    <button style="background:#111;color:white;border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:8px 16px;">
      + 添加
    </button>
  </div>

  <div style="display:flex;gap:10px;margin-top:16px;">
    <button style="flex:1;padding:10px;border-radius:14px;background:white;color:black;border:none;font-weight:700;">
      持有+自选
    </button>
    <button style="flex:1;padding:10px;border-radius:14px;background:#111;color:white;border:1px solid rgba(255,255,255,.08);">
      全部
    </button>
  </div>

  <div id="fundList" style="margin-top:18px;display:flex;flex-direction:column;gap:12px;">
    <div class="fund-item" style="padding:16px;border-radius:18px;background:rgba(255,255,255,.05);">
      <div style="display:flex;justify-content:space-between;">
        <div>
          <div style="font-weight:700;">广发半导体设备联接C</div>
          <div style="font-size:13px;color:#888;">014861</div>
        </div>
        <div style="text-align:right;">
          <div style="color:#4cd964;font-weight:700;">+2.36%</div>
          <div style="font-size:13px;color:#888;">AI评分 A+</div>
        </div>
      </div>
    </div>

    <div class="fund-item" style="padding:16px;border-radius:18px;background:rgba(255,255,255,.05);">
      <div style="display:flex;justify-content:space-between;">
        <div>
          <div style="font-weight:700;">东方人工智能主题</div>
          <div style="font-size:13px;color:#888;">017586</div>
        </div>
        <div style="text-align:right;">
          <div style="color:#4cd964;font-weight:700;">+1.83%</div>
          <div style="font-size:13px;color:#888;">AI评分 A</div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="card">
<div style="font-size:14px;color:#aaa;">AI 市场总览</div>
<div class="score">A+</div>
<div style="margin-top:8px;">AI 热度仍强，半导体维持主升，建议保持中等偏高仓位。</div>
<div class="badge">DeepSeek + 通义双AI</div>
</div>

<div class="grid">

<div class="small">
<div style="color:#aaa;">AI 仓位</div>
<div style="font-size:28px;font-weight:800;margin-top:6px;">68%</div>
</div>

<div class="small">
<div style="color:#aaa;">市场情绪</div>
<div style="font-size:28px;font-weight:800;margin-top:6px;">72</div>
</div>

<div class="small">
<div style="color:#aaa;">风险指数</div>
<div style="font-size:22px;font-weight:800;margin-top:6px;">中</div>
</div>

<div class="small">
<div style="color:#aaa;">今日收益</div>
<div style="font-size:22px;font-weight:800;margin-top:6px;color:#4cd964;">+1.82%</div>
</div>

</div>

<div class="card">
<div style="font-size:18px;font-weight:700;">波段中心</div>

<div style="margin-top:14px;padding:14px;border-radius:16px;background:rgba(255,80,80,.08);">
<div style="font-size:14px;">今日 · 低位区</div>
<div style="font-size:24px;font-weight:800;margin-top:4px;">AI 判断：关注机会</div>
<div style="margin-top:6px;color:#bbb;">RSI＜30、MACD 底背离、触及布林下轨时会在这里显示。</div>
</div>

<div style="margin-top:12px;padding:14px;border-radius:16px;background:rgba(80,170,255,.08);">
<div style="font-size:14px;">今日 · 高位区</div>
<div style="font-size:24px;font-weight:800;margin-top:4px;">AI 判断：暂无</div>
<div style="margin-top:6px;color:#bbb;">RSI＞70、布林上轨时会在这里提醒。</div>
</div>

</div>

<div style="height:90px"></div>

<div class="bottom">
<div class="tab active">基金</div>
<div class="tab">板块</div>
<div class="tab">AI</div>
<div class="tab">资讯</div>
<div class="tab">我的</div>
</div>

<script>
function updateTime(){
const d=new Date();
document.getElementById("time").innerText=
String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+" "+
String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
updateTime();
setInterval(updateTime,60000);// 基金搜索
const search=document.getElementById("searchInput");

if(search){
  search.addEventListener("input",()=>{
    const keyword=search.value.toLowerCase();
    document.querySelectorAll(".fund-item").forEach(item=>{
      const txt=item.innerText.toLowerCase();
      item.style.display=txt.includes(keyword)?"block":"none";
    });
  });
}
</script>

</body>
</html>
