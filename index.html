<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>Fund AI Pro</title>
<style>
:root{--bg:#f6f7f9;--text:#111827;--sub:#737b87;--line:rgba(150,190,225,.25);--red:#d94a4f;--green:#15966d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{padding:14px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
.dashboard{position:relative;overflow:hidden;max-width:760px;margin:0 auto;padding:20px;border:1px solid rgba(255,255,255,.92);border-radius:34px;background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(247,250,253,.76));box-shadow:0 18px 45px rgba(50,75,100,.09),inset 0 1px rgba(255,255,255,.96)}
.dashboard:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(128,199,255,.14),transparent 24%,transparent 74%,rgba(255,255,255,.72))}
.header,.grid,.money{position:relative;z-index:1}.header{display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:27px;font-weight:750;letter-spacing:-.7px}.subtitle{margin-top:3px;font-size:14px;color:var(--sub)}.status{margin-top:8px;font-size:12px;color:var(--sub)}
.refresh{border:1px solid rgba(130,180,220,.28);border-radius:999px;padding:9px 14px;background:rgba(255,255,255,.68);color:#34404c;font-size:13px;font-weight:600;box-shadow:0 5px 15px rgba(70,100,130,.07);-webkit-tap-highlight-color:transparent}.refresh:active{transform:scale(.96)}.refresh.spinning{animation:spin .38s ease}@keyframes spin{to{transform:rotate(360deg)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:19px}.index{min-width:0;padding:14px;border-radius:22px;background:rgba(255,255,255,.64);border:1px solid rgba(150,190,225,.21);box-shadow:inset 0 1px rgba(255,255,255,.82)}.name{font-size:13px;color:var(--sub)}.value{margin-top:5px;font-size:24px;font-weight:720;letter-spacing:-.5px}.change{margin-top:2px;font-size:13px;font-weight:650}.up{color:var(--red)}.down{color:var(--green)}.spark{display:block;width:100%;height:28px;margin-top:7px}.spark polyline{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.money{margin-top:14px;padding:16px;border-radius:27px;background:rgba(255,255,255,.68);border:1px solid rgba(150,190,225,.23);box-shadow:inset 0 1px rgba(255,255,255,.88)}
.money-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.money-title{font-size:18px;font-weight:750;letter-spacing:-.3px}.money-desc{margin-top:3px;font-size:12px;color:var(--sub)}.money-time{font-size:11px;color:var(--sub);white-space:nowrap}
.big-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.metric{min-width:0;padding:13px 13px 12px;border-radius:19px;background:rgba(248,250,252,.78);border:1px solid rgba(150,170,190,.13)}.metric-label{display:flex;align-items:center;gap:6px;color:#66707c;font-size:12px;white-space:nowrap;overflow:hidden}.metric-label b{color:#4c5560;font-weight:600}.metric-value{margin-top:7px;font-size:23px;font-weight:760;letter-spacing:-.7px;white-space:nowrap}.metric-unit{font-size:13px;font-weight:600;margin-left:3px}.metric-note{margin-top:2px;font-size:10px;color:#9aa1a9}
.flow-title{display:flex;align-items:center;justify-content:space-between;margin:17px 2px 9px}.flow-title strong{font-size:15px}.flow-title span{font-size:11px;color:var(--sub)}.flow-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.flow-col{min-width:0;padding:11px 12px;border-radius:19px;background:rgba(248,250,252,.72)}.flow-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.flow-head h3{margin:0;font-size:12px}.flow-head span{font-size:10px;color:var(--sub)}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(120,140,160,.1);font-size:12px}.row:last-child{border-bottom:0}.sector{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.amount{font-weight:680;white-space:nowrap}.empty{color:var(--sub);font-size:12px;padding:9px 0}
@media(max-width:390px){body{padding:10px}.dashboard{padding:16px;border-radius:29px}.brand{font-size:24px}.index{padding:12px}.value{font-size:22px}.metric-value{font-size:20px}.flow-grid{gap:7px}.flow-col{padding:10px}.money{padding:14px}}
@media(prefers-reduced-motion:reduce){.refresh.spinning{animation:none}}
</style>
</head>
<body>
<main class="dashboard">
<header class="header">
<div><div class="brand">Fund AI Pro</div><div class="subtitle">智能决策台</div><div class="status" id="status">准备更新 · 数据源待连接</div></div>
<button class="refresh" id="refresh" type="button">刷新 ↻</button>
</header>
<section class="grid" aria-label="四大指数">
<article class="index"><div class="name">上证指数</div><div class="value" id="sse">--</div><div class="change" id="sseChange">等待数据</div><svg class="spark" viewBox="0 0 160 30" preserveAspectRatio="none"><polyline points="0,20 25,17 50,19 75,13 100,15 125,9 160,12" stroke="#15966d"/></svg></article>
<article class="index"><div class="name">深证成指</div><div class="value" id="sz">--</div><div class="change" id="szChange">等待数据</div><svg class="spark" viewBox="0 0 160 30" preserveAspectRatio="none"><polyline points="0,12 25,14 50,11 75,18 100,15 125,20 160,17" stroke="#15966d"/></svg></article>
<article class="index"><div class="name">创业板指</div><div class="value" id="cyb">--</div><div class="change" id="cybChange">等待数据</div><svg class="spark" viewBox="0 0 160 30" preserveAspectRatio="none"><polyline points="0,22 25,19 50,15 75,17 100,10 125,13 160,8" stroke="#15966d"/></svg></article>
<article class="index"><div class="name">科创50</div><div class="value" id="kc50">--</div><div class="change" id="kc50Change">等待数据</div><svg class="spark" viewBox="0 0 160 30" preserveAspectRatio="none"><polyline points="0,15 25,18 50,16 75,12 100,14 125,9 160,11" stroke="#15966d"/></svg></article>
</section>
<section class="money" aria-label="资金全景">
<div class="money-head"><div><div class="money-title">资金全景</div><div class="money-desc">大资金决定方向 · 板块资金决定去向</div></div><div class="money-time" id="fundTime">等待数据</div></div>
<div class="big-grid">
<div class="metric"><div class="metric-label">👥 <b>散户资金</b> 中+小单</div><div class="metric-value up" id="retail">--<span class="metric-unit">亿</span></div><div class="metric-note">中单 + 小单</div></div>
<div class="metric"><div class="metric-label">🏦 <b>机构资金</b> 超大单</div><div class="metric-value down" id="institution">--<span class="metric-unit">亿</span></div><div class="metric-note">超大单</div></div>
<div class="metric"><div class="metric-label">🎩 <b>游资/大户</b> 大单</div><div class="metric-value down" id="large">--<span class="metric-unit">亿</span></div><div class="metric-note">大单</div></div>
<div class="metric"><div class="metric-label">📊 <b>全市场成交</b> 总额</div><div class="metric-value" id="turnover">--<span class="metric-unit">亿</span></div><div class="metric-note">沪深市场</div></div>
</div>
<div class="flow-title"><strong>钱往哪里走</strong><span>板块净流入 / 净流出 TOP5</span></div>
<div class="flow-grid">
<div class="flow-col"><div class="flow-head"><h3 class="up">↗ 净流入 TOP5</h3><span>实时</span></div><div id="inflow"><div class="empty">等待真实数据</div></div></div>
<div class="flow-col"><div class="flow-head"><h3 class="down">↘ 净流出 TOP5</h3><span>实时</span></div><div id="outflow"><div class="empty">等待真实数据</div></div></div>
</div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);const refresh=$('refresh');
function updateTime(){const now=new Date();$('status').textContent=`更新 ${now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})} · 点击刷新`;$('fundTime').textContent='等待真实资金接口'}
refresh.addEventListener('click',()=>{refresh.classList.remove('spinning');void refresh.offsetWidth;refresh.classList.add('spinning');updateTime()});updateTime();
</script>
</body>
</html>
