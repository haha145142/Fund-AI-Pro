<!DOCTYPE html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>Fund AI Pro</title><style>:root{--bg:#e9f2fb;--glass:rgba(255,255,255,.16);--line:rgba(255,255,255,.38);--text:#fff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#2f7bdc,#9dc7ff);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC";padding:20px;color:var(--text)}.card{border-radius:34px;padding:22px;background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(180,220,255,.08));border:1px solid var(--line);box-shadow:0 12px 40px rgba(30,80,160,.25),inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1px rgba(120,200,255,.18)}.head{display:flex;justify-content:space-between;align-items:flex-start}.pill{padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.box{border-radius:24px;padding:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18)}.num{font-size:30px;font-weight:700;color:#79ffae}.fund{margin-top:12px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}.red{color:#ff8d8d}.green{color:#79ffae}</style></head><body><div class='card'><div class='head'><div><h1>📊 Fund AI Pro</h1><div>智能决策台</div><div id='time'>更新中...</div></div><div class='pill' id='refresh'>刷新</div></div><div class='grid'><div class='box'><div>上证指数</div><div class='num' id='sse'>--</div></div><div class='box'><div>深证成指</div><div class='num' id='sz'>--</div></div><div class='box'><div>创业板</div><div class='num' id='cyb'>--</div></div><div class='box'><div>科创50</div><div class='num' id='kc50'>--</div></div></div><div class='box fund'><h3>💰 今日资金方向</h3><div id='fundList'>点击刷新获取真实资金流向</div></div></div><script>const ids=['sse','sz','cyb','kc50'];document.getElementById('refresh').onclick=()=>{document.getElementById('refresh').style.transform='rotate(360deg)';document.getElementById('time').innerText='更新 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});ids.forEach(id=>document.getElementById(id).innerText='实时');document.getElementById('fundList').innerHTML='<div class="row"><span>实时资金榜</span><span class="red">加载中...</span></div>';setTimeout(()=>document.getElementById('refresh').style.transform='rotate(0deg)',300)};</script></body></html>
