<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f9"><title>Fund AI Pro</title><style>
:root{--bg:#f6f7f9;--text:#111827;--sub:#737b87;--line:rgba(150,190,225,.22);--red:#d94a4f;--green:#15966d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{padding:14px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}.dashboard{position:relative;overflow:hidden;max-width:760px;margin:0 auto;padding:20px;border:1px solid rgba(255,255,255,.92);border-radius:34px;background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(247,250,253,.76));box-shadow:0 18px 45px rgba(50,75,100,.09),inset 0 1px rgba(255,255,255,.96)}.dashboard:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(128,199,255,.14),transparent 24%,transparent 74%,rgba(255,255,255,.72))}.header,.grid,.money{position:relative;z-index:1}.header{display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:27px;font-weight:750;letter-spacing:-.7px}.subtitle{margin-top:3px;font-size:14px;color:var(--sub)}.status{margin-top:8px;font-size:12px;color:var(--sub)}.refresh{border:1px solid rgba(130,180,220,.28);border-radius:999px;padding:9px 14px;background:rgba(255,255,255,.68);color:#34404c;font-size:13px;font-weight:600;box-shadow:0 5px 15px rgba(70,100,130,.07);-webkit-tap-highlight-color:transparent}.refresh:active{transform:scale(.96)}.refresh.spinning{animation:spin .38s ease}@keyframes spin{to{transform:rotate(360deg)}}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:19px}.index{min-width:0;padding:14px;border-radius:22px;background:rgba(255,255,255,.64);border:1px solid rgba(150,190,225,.21);box-shadow:inset 0 1px rgba(255,255,255,.82)}.name{font-size:13px;color:var(--sub)}.value{margin-top:5px;font-size:24px;font-weight:720;letter-spacing:-.5px}.change{margin-top:2px;font-size:13px;font-weight:650}.up{color:var(--red)}.down{color:var(--green)}.spark{display:block;width:100%;height:28px;margin-top:7px}.spark polyline{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.money{margin-top:14px;padding:17px 16px;border-radius:27px;background:rgba(255,255,255,.68);border:1px solid rgba(150,190,225,.23);box-shadow:inset 0 1px rgba(255,255,255,.88)}.money-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.money-title{font-size:18px;font-weight:750;letter-spacing:-.3px}.money-desc{margin-top:3px;font-size:12px;color:var(--sub)}.money-time{font-size:11px;color:var(--sub);white-space:nowrap}.metrics{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.metric{min-width:0;padding:13px 8px 12px;background:transparent}.metric+.metric{border-left:1px solid var(--line)}.metric-label{display:flex;align-items:center;gap:5px;color:#66707c;font-size:12px;white-space:nowrap;overflow:hidden}.metric-label b{color:#4c5560;font-weight:600}.metric-value{margin-top:6px;font-size:clamp(15px,5.8vw,23px);font-weight:760;letter-spacing:-.7px;white-space:nowrap;overflow:visible;font-variant-numeric:tabular-nums}.metric-unit{font-size:12px;font-weight:600;margin-left:2px}.metric-note{margin-top:2px;font-size:10px;color:#9aa1a9}.metric:nth-child(4){grid-column:1/-1;border-left:0!important;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px 10px}.metric:nth-child(4) .metric-value{margin-top:0}.flow-title{display:flex;align-items:center;justify-content:space-between;margin:15px 2px 7px}.flow-title strong{font-size:15px}.flow-title span{font-size:11px;color:var(--sub)}.flow-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.flow-col{min-width:0}.flow-col:first-child{padding-right:9px;border-right:1px solid var(--line)}.flow-col:last-child{padding-left:9px}.flow-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}.flow-head h3{margin:0;font-size:12px}.flow-head span{font-size:10px;color:var(--sub)}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(120,140,160,.1);font-size:12px}.row:last-child{border-bottom:0}.sector{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.amount{font-weight:680;white-space:nowrap}.empty{color:var(--sub);font-size:12px;padding:9px 0}@media(max-width:390px){body{padding:10px}.dashboard{padding:16px;border-radius:29px}.brand{font-size:24px}.index{padding:12px}.value{font-size:22px}.metric{padding-left:4px;padding-right:4px}.metric-value{font-size:clamp(14px,5.2vw,18px)}.metric-label{font-size:11px}.metric-unit{font-size:11px}.flow-grid{gap:10px}.flow-col:first-child{padding-right:6px}.flow-col:last-child{padding-left:6px}.money{padding:14px}}
@media(prefers-reduced-motion:reduce){.refresh.spinning{animation:none}}
</style></head><body><main class="dashboard"><header class="header"><div><div class="brand">Fund AI Pro</div><div class="subtitle">智能决策台</div><div class="status" id="status">正在连接实时行情…</div></div><button class="refresh" id="refresh" type="button">刷新 ↻</button></header><section class="grid" aria-label="四大指数"><article class="index"><div class="name">上证指数</div><div class="value" id="sse">--</div><div class="change" id="sseChange">正在获取</div><svg class="spark" viewBox="0 0 160 30" preserveAspectRatio="none"><polyline id="sseSpark" points="0,20 25,17 50,19 75,13 100,15 125,9 160,12"/></svg></article><article class="index"><div class="name">深证成指</div><div class="value" id="sz">--</div><div class="change" id="szChange">正在获取</div><svg class="spark" viewBox="0 0 160 30" preserveAspectRatio="none"><polyline id="szSpark" points="0,12 25,14 50,11 75,18 100,15 125,20 160,17"/></svg></article><article class="index"><div class="name">创业板指</div><div class="value" id="cyb">--</div><div class="change" id="cybChange">正在获取</div><svg class="spark" viewBox="0 0 160 30" preserveAspectRatio="none"><polyline id="cybSpark" points="0,22 25,19 50,15 75,17 100,10 125,13 160,8"/></svg></article><article class="index"><div class="name">科创50</div><div class="value" id="kc50">--</div><div class="change" id="kc50Change">正在获取</div><svg class="spark" viewBox="0 0 160 30" preserveAspectRatio="none"><polyline id="kc50Spark" points="0,15 25,18 50,16 75,12 100,14 125,9 160,11"/></svg></article></section><section class="money" aria-label="资金全景"><div class="money-head"><div><div class="money-title">资金全景</div><div class="money-desc">大资金决定方向 · 板块资金决定去向</div></div><div class="money-time" id="fundTime">正在获取</div></div><div class="metrics"><div class="metric"><div><div class="metric-label">👥 <b>散户</b> · 中单 + 小单</div><div class="metric-value" id="retail">--<span class="metric-unit">亿</span></div><div class="metric-note">中单 + 小单</div></div></div><div class="metric"><div><div class="metric-label">🏦 <b>主力</b> · 超大单</div><div class="metric-value" id="institution">--<span class="metric-unit">亿</span></div><div class="metric-note">超大单</div></div></div><div class="metric"><div><div class="metric-label">🎩 <b>大单</b> · 大单</div><div class="metric-value" id="large">--<span class="metric-unit">亿</span></div><div class="metric-note">大单</div></div></div><div class="metric"><div><div class="metric-label">📊 <b>全市场成交额</b></div><div class="metric-note">沪深市场 · 实时汇总</div></div><div class="metric-value" id="turnover">--<span class="metric-unit">亿</span></div></div></div><div class="flow-title"><strong>钱往哪里走</strong><span>行业板块净流入 / 净流出 TOP5</span></div><div class="flow-grid"><div class="flow-col"><div class="flow-head"><h3 class="up">↗ 净流入 TOP5</h3><span>实时</span></div><div id="inflow"><div class="empty">正在获取真实数据</div></div></div><div class="flow-col"><div class="flow-head"><h3 class="down">↘ 净流出 TOP5</h3><span>实时</span></div><div id="outflow"><div class="empty">正在获取真实数据</div></div></div></div></section></main><script>
const $=id=>document.getElementById(id),refresh=$('refresh'),history={sse:[],sz:[],cyb:[],kc50:[]};let loading=false;
function fmt(n,d=2){return Number.isFinite(n)?n.toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d}):'--'}function fmtMoney(n){return Number.isFinite(n)?`${n>=0?'+':''}${n.toFixed(2)}`:'--'}
function setValue(id,value,pct){const el=$(id),change=$(id+'Change');el.textContent=fmt(value);change.textContent=Number.isFinite(pct)?`${pct>=0?'+':''}${pct.toFixed(2)}%`:'--';change.className=`change ${pct>=0?'up':'down'}`}
function drawSpark(id,values,pct){if(values.length<2)return;const min=Math.min(...values),max=Math.max(...values),range=max-min||1;$(id+'Spark').setAttribute('points',values.map((v,i)=>`${i/(values.length-1)*160},${27-(v-min)/range*23}`).join(' '));$(id+'Spark').setAttribute('stroke',pct>=0?'#d94a4f':'#15966d')}
function renderFlows(id,rows,positive){const box=$(id);if(!rows?.length){box.innerHTML='<div class="empty">暂无可用数据</div>';return}box.innerHTML=rows.map((r,i)=>`<div class="row"><span class="sector">${i+1}. ${escapeHtml(r.name)}</span><span class="amount ${positive?'up':'down'}">${r.net>=0?'+':''}${r.net.toFixed(2)}亿</span></div>`).join('')}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function loadMarket(){if(loading)return;loading=true;refresh.disabled=true;refresh.classList.remove('spinning');void refresh.offsetWidth;refresh.classList.add('spinning');try{const r=await fetch(`/api/market?_=${Date.now()}`,{cache:'no-store'}),d=await r.json();if(!d?.indexes?.length)throw new Error('实时行情暂不可用');d.indexes.forEach(x=>{setValue(x.id,x.price,x.pct);history[x.id].push(x.price);if(history[x.id].length>24)history[x.id].shift();drawSpark(x.id,history[x.id],x.pct)});if(d.market){const setMoney=(id,n)=>{const el=$(id);el.className=`metric-value ${n>=0?'up':'down'}`;el.innerHTML=`${fmtMoney(n)}<span class="metric-unit">亿</span>`};setMoney('retail',d.market.medium+d.market.small);setMoney('institution',d.market.superLarge);setMoney('large',d.market.large);const t=$('turnover');t.className='metric-value';t.innerHTML=`${fmt(d.market.turnover)}<span class="metric-unit">亿</span>`}renderFlows('inflow',d.sectors?.inflow,true);renderFlows('outflow',d.sectors?.outflow,false);const valid=d.validation?.validatedCount||0;const checked=valid===4&&d.validation?.turnoverValidated;$('status').textContent=`更新 ${new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})} · ${checked?'东财 × 腾讯校验':'实时数据'}`;$('fundTime').textContent=`实时 · ${d.latencyMs||0}ms`}catch(e){$('status').textContent='实时数据连接失败 · 请点击刷新';$('fundTime').textContent='数据暂不可用'}finally{loading=false;refresh.disabled=false}}
refresh.addEventListener('click',loadMarket);loadMarket();setInterval(()=>{if(!document.hidden)loadMarket()},10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadMarket()});
</script></body></html>
